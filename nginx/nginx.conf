# ==============================================================================
# Nginx Reverse Proxy Configuration - Phase 4 (P4)
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Hide Nginx version for security
    server_tokens off;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Prevent clickjacking attacks by only allowing framing from the same origin
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Control Referer information sent in requests
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enable browser legacy XSS filter
    add_header X-XSS-Protection "1; mode=block" always;

    # Restrict modern browser feature permissions
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy (allows self-hosted scripts, inline UI helpers, and styles)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';" always;

    # --------------------------------------------------------------------------
    # Logging
    # --------------------------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # Reverse Proxy to Node.js Express Application (service name: app)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
