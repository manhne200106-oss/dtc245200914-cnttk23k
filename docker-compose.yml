services:
  # ============================================================================
  # 1. PostgreSQL Database Service (Internal Backend Network)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: pm-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_management}
      POSTGRES_USER: ${POSTGRES_USER:-project_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Port 5432 removed from public host exposure for database hardening (internal only)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-project_user} -d ${POSTGRES_DB:-project_management}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-network

  # ============================================================================
  # 2. Node.js Express Web Application Service (Internal Backend Network)
  # ============================================================================
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pm-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-project_management}
      POSTGRES_USER: ${POSTGRES_USER:-project_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Port 3000 removed from host exposure; access via Nginx reverse proxy on port 8081
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-network

  # ============================================================================
  # 3. pgAdmin 4 Database Administration Web UI Service
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-network

  # ============================================================================
  # 4. Nginx Reverse Proxy & Security Headers Service (Gateway Bridge)
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: pm-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${NGINX_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - backend-network
      - monitoring-network

  # ============================================================================
  # 5. Docker Container Metrics Exporter (docker-exporter)
  # ============================================================================
  docker-exporter:
    image: ghcr.io/davidborzek/docker-exporter:latest
    container_name: pm-docker-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring-network

  # ============================================================================
  # 6. Nginx Web Server Metrics Exporter
  # ============================================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: pm-nginx-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - '-nginx.scrape-uri=http://nginx:80/stub_status'
    depends_on:
      - nginx
    networks:
      - monitoring-network

  # ============================================================================
  # 7. PostgreSQL Database Metrics Exporter (Network Bridge)
  # ============================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: pm-postgres-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-project_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-project_management}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-network
      - monitoring-network

  # ============================================================================
  # 8. Prometheus Monitoring Server
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: pm-prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - docker-exporter
      - nginx-exporter
      - postgres-exporter
    networks:
      - monitoring-network

  # ============================================================================
  # 9. Grafana Dashboards & Visualization Service
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: pm-grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/project_management.json"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring-network

  # ============================================================================
  # 10. Loki Centralized Log Aggregation Server (Internal Monitoring Network)
  # ============================================================================
  loki:
    image: grafana/loki:latest
    container_name: pm-loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: -config.file=/etc/loki/loki-config.yml
    # Port 3100 removed from host exposure; internal access via Grafana and Promtail
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring-network

  # ============================================================================
  # 11. Promtail Docker Log Shipper Agent
  # ============================================================================
  promtail:
    image: grafana/promtail:latest
    container_name: pm-promtail
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      - loki
    networks:
      - monitoring-network

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: pm_postgres_data
  pgadmin_data:
    name: pm_pgadmin_data
  prometheus_data:
    name: pm_prometheus_data
  grafana_data:
    name: pm_grafana_data
  loki_data:
    name: pm_loki_data
  promtail_positions:
    name: pm_promtail_positions

# ==============================================================================
# Isolated Least-Privilege Docker Bridge Networks
# ==============================================================================
networks:
  backend-network:
    name: pm_backend_network
    driver: bridge
  monitoring-network:
    name: pm_monitoring_network
    driver: bridge
