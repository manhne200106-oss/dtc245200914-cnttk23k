# ==============================================================================
# Grafana Dashboard Provisioning Provider - Phase 5 (P5)
# ==============================================================================

apiVersion: 1

providers:
  - name: 'Project Management Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
